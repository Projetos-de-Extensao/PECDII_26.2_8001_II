name: Testes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    # os testes rodam no mesmo banco do servidor (PostgreSQL)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pkzlab
          POSTGRES_USER: pkzlab
          POSTGRES_PASSWORD: pkzlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pkzlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: pkzlab
      POSTGRES_USER: pkzlab
      POSTGRES_PASSWORD: pkzlab
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verificar o projeto
        run: python manage.py check
      - name: Migrações em dia com os models
        run: python manage.py makemigrations --check --dry-run
      - name: Rodar os testes
        run: python manage.py test
